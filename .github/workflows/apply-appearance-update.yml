name: Apply Student Hub Android Appearance Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate packages
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="Student_Hub_Admin_Android_Engineered_Package_V1.1.1.zip"

          if [ ! -f "$PACKAGE" ]; then
            echo "::error::Engineered appearance package is missing from repository root."
            ls -la
            exit 1
          fi

          unzip -t "$PACKAGE"

      - name: Extract updated Android project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/student-hub-appearance
          unzip -q -o \
            Student_Hub_Admin_Android_Engineered_Package_V1.1.1.zip \
            -d /tmp/student-hub-appearance

          SOURCE="/tmp/student-hub-appearance"

          test -f "$SOURCE/settings.gradle"
          test -f "$SOURCE/build.gradle"
          test -f "$SOURCE/app/build.gradle"
          test -f "$SOURCE/app/src/main/AndroidManifest.xml"

          cp -a "$SOURCE/." .

          echo "Updated Android source files have been integrated."
          test -f settings.gradle
          test -f app/src/main/java/ug/studenthub/adminapp/MainActivity.java

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build updated APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload updated APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Hub-Admin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
