name: Restore and Build Student Hub Admin Android App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect and restore Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Inspecting available packages..."

          find . -maxdepth 2 -type f -name '*.zip' -print

          mkdir -p /tmp/student-hub-starter
          unzip -q -o Student_Hub_V1_Admin_Android_Wrapper_Starter_V1.0.zip \
            -d /tmp/student-hub-starter

          SETTINGS="$(find /tmp/student-hub-starter -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::The starter ZIP does not contain a Gradle settings file."
            find /tmp/student-hub-starter -maxdepth 4 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "Starter project found at: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f -print

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "::error::The restored project has no app directory."
            exit 1
          fi

          echo "ANDROID_PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build starter APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Hub-Admin-APK
          path: ${{ env.ANDROID_PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
