name: Apply Student Hub Android Appearance Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply appearance update package
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE="Student_Hub_Admin_Android_Appearance_Update_V1.1.zip"
          test -f "$PACKAGE" || { echo "Upload $PACKAGE to the repository root first."; exit 1; }
          unzip -o "$PACKAGE" -d .
          rm "$PACKAGE"

      - name: Save updated Android source to main branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes detected."
          else
            git commit -m "Improve Student Hub Admin app branding and startup screen"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build updated debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Student-Hub-Admin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
