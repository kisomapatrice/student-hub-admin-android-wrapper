
name: Build Student Hub Admin Android v1.2.1

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare clean installable V1.2.1 source
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/ug/studenthub/adminapp/MainActivity.java
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          cat > app/build.gradle <<'GRADLE'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'ug.studenthub.adminapp'
              compileSdk 35

              defaultConfig {
                  applicationId 'ug.studenthub.adminapp.v121'
                  minSdk 23
                  targetSdk 34
                  versionCode 4
                  versionName '1.2.1'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          GRADLE

          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text, count = re.subn(r'android:label="[^"]+"', 'android:label="Student Hub Admin 1.2.1"', text, count=1)
          if count != 1:
              raise SystemExit('Could not update the Android app label.')
          manifest.write_text(text, encoding='utf-8')

          activity = Path('app/src/main/java/ug/studenthub/adminapp/MainActivity.java')
          text = activity.read_text(encoding='utf-8')
          text = text.replace('V1.2.0', 'V1.2.1')
          activity.write_text(text, encoding='utf-8')
          PY

          grep -q "applicationId 'ug.studenthub.adminapp.v121'" app/build.gradle
          grep -q "versionName '1.2.1'" app/build.gradle
          grep -q 'Student Hub Admin 1.2.1' app/src/main/AndroidManifest.xml
          echo 'Project source is prepared for a clean V1.2.1 build.'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean-build APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK archive, signature, and package
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"

          echo 'APK file size:'
          ls -lh "$APK"
          echo 'Checking ZIP structure:'
          unzip -t "$APK"

          echo 'Checking Android APK signature:'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          echo 'Checking package ID and version:'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package: name='ug.studenthub.adminapp.v121' versionCode='4' versionName='1.2.1'"

          echo 'APK SHA-256:'
          sha256sum "$APK"
          echo 'APK validation passed.'

      - name: Save prepared Android source to repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/ug/studenthub/adminapp/MainActivity.java
          if ! git diff --cached --quiet; then
            git commit -m "Prepare Student Hub Admin Android v1.2.1 source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo 'Project source already matches V1.2.1.'
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Hub-Admin-v1.2.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
