name: Build Student Hub Admin Android v1.2.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android source archive
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="android-source-v1.2.1.zip"
          if [ ! -f "$SOURCE_ZIP" ]; then
            echo "ERROR: $SOURCE_ZIP is missing from the repository root. Upload the complete source ZIP to the repository root first."
            echo "Expected file: android-source-v1.2.1.zip"
            exit 1
          fi
          mkdir -p /tmp/student-hub-android-source
          unzip -q "$SOURCE_ZIP" -d /tmp/student-hub-android-source
          SRC=/tmp/student-hub-android-source
          for f in settings.gradle build.gradle gradle.properties app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/ug/studenthub/adminapp/MainActivity.java; do
            if [ ! -f "$SRC/$f" ]; then
              echo "ERROR: source ZIP is missing required file: $f"
              exit 1
            fi
          done
          cp "$SRC/settings.gradle" .
          cp "$SRC/build.gradle" .
          cp "$SRC/gradle.properties" .
          cp -a "$SRC/app" ./app
          echo "Android source extracted successfully."

      - name: Prepare V1.2.1 app metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text = re.sub(r"applicationId\s+['\"][^'\"]+['\"]", "applicationId 'ug.studenthub.adminapp.v121'", text, count=1)
          text = re.sub(r"versionCode\s+\d+", "versionCode 4", text, count=1)
          text = re.sub(r"versionName\s+['\"][^'\"]+['\"]", "versionName '1.2.1'", text, count=1)
          if "applicationId 'ug.studenthub.adminapp.v121'" not in text or "versionName '1.2.1'" not in text:
              raise SystemExit('Could not set application ID and version in app/build.gradle')
          gradle.write_text(text, encoding='utf-8')

          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          text, count = re.subn(r'android:label="[^"]+"', 'android:label="Student Hub Admin 1.2.1"', text, count=1)
          if count != 1:
              raise SystemExit('Could not update Android app label in manifest')
          manifest.write_text(text, encoding='utf-8')

          activity = Path('app/src/main/java/ug/studenthub/adminapp/MainActivity.java')
          text = activity.read_text(encoding='utf-8').replace('V1.2.0', 'V1.2.1')
          activity.write_text(text, encoding='utf-8')
          PY
          test -f app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "V1.2.1 metadata prepared."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK and show diagnostics
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK" ]; then
            echo "ERROR: Gradle did not produce a non-empty APK at $APK"
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "APK file size:"
          ls -lh "$APK"
          echo "ZIP integrity:"
          unzip -t "$APK"
          echo "Android signature:"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          echo "Package/version:"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package: name='ug.studenthub.adminapp.v121' versionCode='4' versionName='1.2.1'"
          echo "SHA-256:"
          sha256sum "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Student-Hub-Admin-v1.2.1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
